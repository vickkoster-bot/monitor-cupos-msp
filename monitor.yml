name: Monitor cupos MSP

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Enviar únicamente un mensaje de prueba por Telegram"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: write

concurrency:
  group: monitor-cupos-msp
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Probar Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --test-telegram

      - name: Revisar agendas
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar estado para evitar avisos repetidos
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        run: |
          if git diff --quiet -- state.json; then
            echo "Sin cambios en el estado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Actualizar estado del monitor [skip ci]"
          git push

      - name: Subir capturas de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-error
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
